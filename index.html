 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Póster</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        /* Reseteo básico para evitar desbordes */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #e9ecef;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            justify-content: center; /* Centra verticalmente si hay espacio */
        }

        /* Contenedor del Póster: Ahora es responsive */
        #poster-area {
            background-image: url('bg.jpg');
            background-size: cover; 
            background-position: center top;
            background-color: #ffffff;
            
            /* Hacemos que se adapte al ancho de la pantalla pero sin pasar de 450px */
            width: 100%;
            max-width: 450px;
            /* Mantiene la proporción original de 450x600 (3:4) en cualquier pantalla */
            aspect-ratio: 3 / 4; 
            
            position: relative; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            overflow: hidden;
            border-radius: 8px; /* Borde ligeramente redondeado para estética */
        }

        /* Contenedor de todo el texto (Nombre + Hashtag) */
        .text-container {
            position: absolute;
            width: 100%;
            /* Usamos porcentaje para que mantenga la posición relativa al reducirse en móviles */
            bottom: 9%; 
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        .text-wrapper {
            width: 90%; 
            display: flex;
            justify-content: center;
        }

        .multicolor-text {
            font-family: 'Archivo Black', sans-serif;
            font-size: 105px; /* Tamaño base, el JS lo ajustará */
            line-height: 0.8;
            letter-spacing: -0.06em;
            transform: scaleY(1.1);
            display: flex;
            justify-content: center;
            white-space: nowrap;
        }

        .multicolor-text span {
            display: inline-block;
        }

        .hashtag-text {
            font-family: 'Arial', sans-serif;
            font-weight: 900;
            /* Usamos 'cqi' o unidades de vista para que el hashtag también escale un poco, o un tamaño fijo prudente */
            font-size: clamp(16px, 5vw, 24px); 
            color: #93328E;
            margin-top: 15px; 
            letter-spacing: 0.5px;
        }

        /* Panel de Controles adaptativo */
        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-top: 20px; 
            
            display: flex;
            flex-wrap: wrap; /* Permite que el input y el botón se apilen en pantallas muy pequeñas */
            gap: 15px;
            justify-content: center;
            align-items: center;
            
            width: 100%;
            max-width: 450px; /* Mismo ancho máximo que el póster para que se vea alineado */
        }

        input[type="text"] {
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid #ccc;
            border-radius: 5px;
            text-align: center;
            text-transform: uppercase;
            flex: 1 1 200px; /* Flexbox: permite que el input crezca y se adapte al espacio */
            min-width: 0; /* Evita que rompa el contenedor en móviles */
        }

        button {
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            background-color: #214088;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            flex: 0 1 auto;
            white-space: nowrap;
        }

        button:hover {
            background-color: #152b60;
        }
    </style>
</head>
<body>

    <div id="poster-area">
        <div class="text-container">
            <div class="text-wrapper">
                <div id="output" class="multicolor-text"></div>
            </div>
            <div class="hashtag-text">#CEPEDA PRESIDENTE</div>
        </div>
    </div>

    <div class="controls">
        <input type="text" id="textInput" value="NOMBRE" maxlength="20" autocomplete="off" placeholder="Escribe el nombre">
        <button onclick="downloadPoster()">Descargar</button>
    </div>

    <script>
        const input = document.getElementById('textInput');
        const output = document.getElementById('output');
        const colors = ['#E9910D', '#214088', '#E72400', '#00882B', '#93328E'];

        function adjustFontSize() {
            // Obtenemos el ancho actual del contenedor (que ahora es dinámico)
            const maxWidth = document.querySelector('.text-wrapper').clientWidth; 
            // Empezamos con un tamaño basado en el ancho del póster para que escale mejor
            let currentSize = document.getElementById('poster-area').clientWidth * 0.23; 
            
            output.style.fontSize = currentSize + 'px';

            while (output.scrollWidth > maxWidth && currentSize > 10) {
                currentSize -= 1;
                output.style.fontSize = currentSize + 'px';
            }
        }

        function renderText(text) {
            output.innerHTML = ''; 
            text.split('').forEach((char, index) => {
                const span = document.createElement('span');
                if (char === ' ') {
                    span.innerHTML = '&nbsp;';
                } else {
                    span.textContent = char;
                    span.style.color = colors[index % colors.length];
                }
                output.appendChild(span);
            });
            
            adjustFontSize();
        }

        // Renderizado inicial
        renderText(input.value);

        // Event listener para actualizar al escribir
        input.addEventListener('input', (e) => {
            renderText(e.target.value.toUpperCase());
        });

        // RE-CALCULAR tamaño de letra si el usuario gira el celular o redimensiona la pantalla
        window.addEventListener('resize', () => {
            renderText(input.value.toUpperCase());
        });

        function downloadPoster() {
            const poster = document.getElementById('poster-area');
            
            html2canvas(poster, {
                scale: 2, // Mantiene alta calidad en la descarga
                useCORS: true,
                backgroundColor: "#ffffff"
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = input.value + '_poster.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
