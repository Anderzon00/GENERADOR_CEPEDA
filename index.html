<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Póster</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e9ecef;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        /* Contenedor del Póster con Imagen Predeterminada */
        #poster-area {
            background-image: url('bg.jpg');
            background-size: 100%;
            background-position: center top;
            background-color: #ffffff;
            width: 450px;
            height: 600px;
            position: relative; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        /* Contenedor de todo el texto (Nombre + Hashtag) */
        .text-container {
            position: absolute;
            width: 100%;
            /* AQUÍ ESTÁ EL CAMBIO: Subimos el texto a 180px (aprox 30% de la altura total) */
            bottom: 55px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        .text-wrapper {
            width: 90%; 
            display: flex;
            justify-content: center;
        }

        .multicolor-text {
            font-family: 'Archivo Black', sans-serif;
            font-size: 105px; 
            line-height: 0.8;
            letter-spacing: -0.06em;
            transform: scaleY(1.1);
            display: flex;
            justify-content: center;
            white-space: nowrap;
        }

        .multicolor-text span {
            display: inline-block;
        }

        .hashtag-text {
            font-family: 'Arial', sans-serif;
            font-weight: 900;
            font-size: 24px;
            color: #93328E;
            margin-top: 15px; 
            letter-spacing: 0.5px;
        }

        /* Panel de Controles movido abajo */
        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-top: 20px; /* Cambiado de margin-bottom a margin-top */
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            max-width: 600px;
        }

        input[type="text"] {
            padding: 10px;
            font-size: 1.2rem;
            border: 2px solid #ccc;
            border-radius: 5px;
            text-align: center;
            text-transform: uppercase;
            width: 250px;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            background-color: #214088;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #152b60;
        }
    </style>
</head>
<body>

    <div id="poster-area">
        <div class="text-container">
            <div class="text-wrapper">
                <div id="output" class="multicolor-text"></div>
            </div>
            <div class="hashtag-text">#CEPEDA PRESIDENTE</div>
        </div>
    </div>

    <div class="controls">
        <input type="text" id="textInput" value="NOMBRE" maxlength="20" autocomplete="off" placeholder="Escribe el nombre">
        <button onclick="downloadPoster()">Descargar</button>
    </div>

    <script>
        const input = document.getElementById('textInput');
        const output = document.getElementById('output');
        const colors = ['#E9910D', '#214088', '#E72400', '#00882B', '#93328E'];

        function adjustFontSize() {
            const maxWidth = document.querySelector('.text-wrapper').clientWidth; 
            let currentSize = 105; 
            
            output.style.fontSize = currentSize + 'px';

            while (output.scrollWidth > maxWidth && currentSize > 20) {
                currentSize -= 2;
                output.style.fontSize = currentSize + 'px';
            }
        }

        function renderText(text) {
            output.innerHTML = ''; 
            text.split('').forEach((char, index) => {
                const span = document.createElement('span');
                if (char === ' ') {
                    span.innerHTML = '&nbsp;';
                } else {
                    span.textContent = char;
                    span.style.color = colors[index % colors.length];
                }
                output.appendChild(span);
            });
            
            adjustFontSize();
        }

        renderText(input.value);

        // Event listener para actualizar en tiempo real
        input.addEventListener('input', (e) => {
            renderText(e.target.value.toUpperCase());
        });

        function downloadPoster() {
            const poster = document.getElementById('poster-area');
            html2canvas(poster, {
                scale: 2, 
                useCORS: true,
                backgroundColor: "#ffffff"
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = input.value + '_poster.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
